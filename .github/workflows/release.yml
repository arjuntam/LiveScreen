name: Publish desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-v0.4.0
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npx electron-builder --win nsis --x64 --publish never && node scripts/verify-windows.cjs
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/LiveScreen-Setup-0.4.0-x64.exe
          if-no-files-found: error
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx electron-builder --config build/mac.cjs --mac --arm64 --publish never && node scripts/package-mac-dmg.cjs
      - run: node scripts/verify-mac.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: dist/mac/LiveScreen-Mac-0.4.0-arm64.dmg
          if-no-files-found: error
  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Calculate checksums and publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum LiveScreen-Setup-0.4.0-x64.exe LiveScreen-Mac-0.4.0-arm64.dmg > SHA256SUMS.txt
          cp ../LICENSE LICENSE.txt
          echo "${{ github.sha }}" > SOURCE_COMMIT.txt
          gh release upload v0.4.0 ./*.exe ./*.dmg SHA256SUMS.txt LICENSE.txt SOURCE_COMMIT.txt --clobber
