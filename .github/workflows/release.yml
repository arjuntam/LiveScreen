name: Publish desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-preview
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check PowerPoint adapter syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'src/desktop/presentation-convert.ps1'), [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - run: npx electron-builder --win nsis --x64 --publish never && node scripts/verify-windows.cjs
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify PDF import from the shipped Windows ASAR
        shell: bash
        run: env -u ELECTRON_RUN_AS_NODE npx electron scripts/verify-packaged-pdf.cjs dist/win-unpacked/resources/app.asar tests/fixtures/three-pages.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/LiveScreen-Setup-*-x64.exe
          if-no-files-found: error
  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-ui-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx electron-builder --config build/mac.cjs --mac --arm64 --publish never && node scripts/package-mac-dmg.cjs
      - run: node scripts/verify-mac.cjs
      - name: Verify PDF import from the shipped Mac ASAR
        run: env -u ELECTRON_RUN_AS_NODE npx electron scripts/verify-packaged-pdf.cjs dist/mac/mac-arm64/LiveScreen.app/Contents/Resources/app.asar tests/fixtures/three-pages.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: dist/mac/LiveScreen-Mac-*-arm64.dmg
          if-no-files-found: error
  publish:
    needs: [windows, mac, windows-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Calculate checksums and publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          TAG="v$VERSION"
          sha256sum LiveScreen-Setup-*-x64.exe LiveScreen-Mac-*-arm64.dmg > SHA256SUMS.txt
          cp ../LICENSE LICENSE.txt
          echo "${{ github.sha }}" > SOURCE_COMMIT.txt
          cp ../THIRD-PARTY-NOTICES.txt THIRD-PARTY-NOTICES.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${{ github.sha }}" --title "LiveScreen $VERSION · PPT/PDF 静态导入预览" --prerelease --notes-file "../docs/releases/$VERSION.md"
          fi
          gh release upload "$TAG" ./*.exe ./*.dmg SHA256SUMS.txt LICENSE.txt THIRD-PARTY-NOTICES.txt SOURCE_COMMIT.txt --clobber
