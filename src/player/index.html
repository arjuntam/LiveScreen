<template id="guideTemplate">

        <h1>手机连接大屏</h1>
        <p class="guide-intro">连接同一网络，扫码打开控制页。</p>
        <article><span class="guide-number">01</span><div><small data-guide-network-title>连接同一网络</small><h2 data-guide-network-name>正在读取网络信息</h2><p data-guide-network-detail></p></div></article>
