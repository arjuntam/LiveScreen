<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>LiveScreen · 场景遥控</title><link rel="icon" href="/favicon.ico?v=0.5.0"><link rel="icon" type="image/svg+xml" href="/icon.svg?v=0.5.0"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=0.5.0"><meta name="apple-mobile-web-app-title" content="LiveScreen"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><div class="brand">LiveScreen <small>场景遥控</small></div><span id="connection" class="status">等待连接</span></header>
<main class="shell"><div id="message" class="notice" role="status" hidden></div>
<form id="login" class="login"><h1>连接大屏</h1><p>手机连接与大屏电脑互通的网络，使用屏幕显示的地址打开本页。</p><p>输入大屏或电脑上显示的 6 位配对码。</p><label>配对码<input name="pin" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" class="pair-input" required></label><button class="primary">配对并连接</button><p id="pairStatus" class="inline-feedback" role="status"></p><p class="muted">这台手机的同一浏览器只需配对一次，以后自动连接。</p></form>
<section id="remote" hidden><div class="live-strip" aria-live="polite"><div><small>LED 当前画面</small><strong id="now">等待状态</strong><small id="nowProject"></small></div><span class="live-tag" id="liveTag">待就绪</span></div>
<section id="pageControls" class="page-controls panel" aria-label="当前场景翻页" hidden></section>
<p id="controlPriority" class="notice" role="status" hidden>电脑正在操作，手机控制暂时让位，请稍候。</p>
<div class="section-head"><div><h1 id="title">选择内容项目</h1><p id="hint" class="muted">先选项目，再点场景。</p></div><button id="back" hidden>← 返回项目</button></div><div id="cards" class="cards"></div>
<footer class="footer"><span>浏览项目不改变 LED；点击场景后切换。</span><details><summary>设备连接选项</summary><p>取消信任后，下次需要重新配对。</p><button id="logout">取消信任此浏览器</button></details></footer></section></main><script src="/common.js"></script><script src="/app.js"></script></body></html>
